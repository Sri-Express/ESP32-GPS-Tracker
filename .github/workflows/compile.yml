name: Compile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  esp32:
    name: ESP32 Dev Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # arduino_secrets.h is gitignored, so CI builds with the placeholder Wi-Fi values
      - name: Use the example Wi-Fi settings
        run: cp gps_tracker/arduino_secrets.example.h gps_tracker/arduino_secrets.h

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12
          libraries: |
            - name: ArduinoJson
              version: 7.4.3
          sketch-paths: |
            - gps_tracker
